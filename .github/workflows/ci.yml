name: offline-name-policy
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-exact.txt
      - run: python -m pip install -e '.[test]' --no-build-isolation
      - run: python -m pytest -q
      - run: ruff check src tests scripts --exclude tests/oracle
      - run: python -m build --no-isolation
      - run: python scripts/verify_package.py dist/*.whl dist/*.tar.gz
      - run: |
          python -m venv .install-check
          .install-check/bin/python -m pip install dist/*.whl
          .install-check/bin/certificate-name-policy examples/synthetic.pem www.example.test
          .install-check/bin/python scripts/offline_smoke.py examples/synthetic.der 192.0.2.1 --kind ip
