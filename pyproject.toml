[build-system]
requires = ["setuptools==82.0.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "certificate-name-policy"
version = "0.1.0"
description = "Bounded offline X.509 DNS/IP SAN name policy checks"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES/service-identity-MIT.txt"]
authors = [{name = "CertificateNamePolicy contributors"}]
dependencies = ["cryptography==47.0.0", "idna==3.20"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Security :: Cryptography"]

[project.scripts]
certificate-name-policy = "certificate_name_policy.cli:main"

[project.optional-dependencies]
test = ["pytest==9.1.1", "attrs==26.1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
certificate_name_policy = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S603", "S607"]
"scripts/*" = ["S603", "S607"]
